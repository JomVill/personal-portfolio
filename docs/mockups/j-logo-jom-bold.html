<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JOM bold — color options</title>
    <style>
      body {
        margin: 0;
        padding: 40px 24px;
        font-family: system-ui, sans-serif;
        background: #f8f8f5;
        color: #252623;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 24px;
        color: #696b64;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        border-radius: 16px;
        border: 1px solid #dedfd8;
        padding: 28px;
      }
      .art {
        display: flex;
        align-items: flex-end;
        gap: 28px;
        flex-wrap: wrap;
      }
      svg {
        display: block;
        max-width: 100%;
      }
      figcaption {
        margin-top: 18px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>JOM bold: color options</h1>
    <p>
      Your bold JOM redrawn as clean vector shapes. Large mark, the J alone as favicon, and a small header
      size.
    </p>
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <symbol id="jom" viewBox="-4 -4 508 338">
          <path
            d="M0 176 Q0 160 16 160 H40 Q56 160 56 176 V262 H64 V44 Q64 0 108 0 H132 V262 Q132 330 66 330 Q0 330 0 262 Z"
            fill="var(--l)"
          />
          <rect x="150" y="0" width="132" height="330" rx="66" fill="var(--o)" />
          <path
            d="M300 330 V50 A50 50 0 0 1 400 50 A50 50 0 0 1 500 50 V330 H454 V56 H446 V240 A46 46 0 0 1 354 240 V56 H346 V330 Z"
            fill="var(--l)"
          />
          <g fill="var(--s)">
            <rect x="56" y="176" width="8" height="86" />
            <rect x="212" y="64" width="8" height="202" />
            <rect x="346" y="56" width="8" height="274" />
            <rect x="446" y="56" width="8" height="274" />
          </g>
        </symbol>
        <symbol id="fav" viewBox="-4 -4 140 338">
          <path
            d="M0 176 Q0 160 16 160 H40 Q56 160 56 176 V262 H64 V44 Q64 0 108 0 H132 V262 Q132 330 66 330 Q0 330 0 262 Z"
            fill="var(--l)"
          />
          <rect x="56" y="176" width="8" height="86" fill="var(--s)" />
        </symbol>
      </defs>
    </svg>
    <div class="grid">
      <figure style="--bg: #f8f8f5; --l: #1f201c; --o: #1f201c; --s: #ee652b; background: #f8f8f5">
        <div class="art">
          <svg viewBox="-4 -4 508 338" width="300"><use href="#jom" /></svg
          ><svg viewBox="-4 -4 140 338" width="38" class="fav"><use href="#fav" /></svg
          ><svg viewBox="-4 -4 508 338" width="60"><use href="#jom" /></svg>
        </div>
        <figcaption style="color: #252623">
          <b>1 · Ink + orange cuts</b> — the cut lines become orange wires
        </figcaption>
      </figure>
      <figure style="--bg: #f8f8f5; --l: #1f201c; --o: #ee652b; --s: #f8f8f5; background: #f8f8f5">
        <div class="art">
          <svg viewBox="-4 -4 508 338" width="300"><use href="#jom" /></svg
          ><svg viewBox="-4 -4 140 338" width="38" class="fav"><use href="#fav" /></svg
          ><svg viewBox="-4 -4 508 338" width="60"><use href="#jom" /></svg>
        </div>
        <figcaption style="color: #252623">
          <b>2 · Orange O</b> — the O is the node — one orange element
        </figcaption>
      </figure>
      <figure style="--bg: #1f201c; --l: #ee652b; --o: #ee652b; --s: #1f201c; background: #1f201c">
        <div class="art">
          <svg viewBox="-4 -4 508 338" width="300"><use href="#jom" /></svg
          ><svg viewBox="-4 -4 140 338" width="38" class="fav"><use href="#fav" /></svg
          ><svg viewBox="-4 -4 508 338" width="60"><use href="#jom" /></svg>
        </div>
        <figcaption style="color: #f8f8f5">
          <b>3 · Orange on ink</b> — bold, high-energy; strongest for social/avatar
        </figcaption>
      </figure>
      <figure style="--bg: #f8f8f5; --l: #1b2a41; --o: #ee652b; --s: #f8f8f5; background: #f8f8f5">
        <div class="art">
          <svg viewBox="-4 -4 508 338" width="300"><use href="#jom" /></svg
          ><svg viewBox="-4 -4 140 338" width="38" class="fav"><use href="#fav" /></svg
          ><svg viewBox="-4 -4 508 338" width="60"><use href="#jom" /></svg>
        </div>
        <figcaption style="color: #252623">
          <b>4 · Navy + orange O</b> — matches the navy blazer photo; calmer, more professional
        </figcaption>
      </figure>
      <figure style="--bg: #252623; --l: #d9dad3; --o: #ee652b; --s: #252623; background: #252623">
        <div class="art">
          <svg viewBox="-4 -4 508 338" width="300"><use href="#jom" /></svg
          ><svg viewBox="-4 -4 140 338" width="38" class="fav"><use href="#fav" /></svg
          ><svg viewBox="-4 -4 508 338" width="60"><use href="#jom" /></svg>
        </div>
        <figcaption style="color: #f8f8f5">
          <b>5 · Silver key</b> — TE-style: warm gray letters, orange O, on charcoal
        </figcaption>
      </figure>
      <figure style="--bg: #e4e5df; --l: #2b2c28; --o: #2b2c28; --s: #ee652b; background: #e4e5df">
        <div class="art">
          <svg viewBox="-4 -4 508 338" width="300"><use href="#jom" /></svg
          ><svg viewBox="-4 -4 140 338" width="38" class="fav"><use href="#fav" /></svg
          ><svg viewBox="-4 -4 508 338" width="60"><use href="#jom" /></svg>
        </div>
        <figcaption style="color: #252623">
          <b>6 · Warm charcoal + orange cuts on silver</b> — quiet, hardware-label feel
        </figcaption>
      </figure>
    </div>
  </body>
</html>
